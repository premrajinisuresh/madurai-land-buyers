name: Run Social & Directory Search

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */12 * * *' # Runs every 12 hours independently

jobs:
  social-search:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run social and directory script
        run: node scripts/social-directory-search.mjs

      - name: Commit and push updated social data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/social-leads.json
          git commit -m "Auto-update social & directory leads [skip ci]" || exit 0
          git push
