name: land-intent-search

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */3 * * *' # Runs every 3 hours (8 times a day)

jobs:
  run-land-search:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run land requirement search
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/land-requirement-search.mjs

      - name: Commit and push updated land database
        run: |
          git config --global user.name "land-finder-bot"
          git config --global user.email "bot@users.noreply.github.com"
          git pull origin main --autostash
          git add landdatabase.json
          git commit -m "Auto: Update land requirement database [skip ci]" || echo "No changes to commit"
          git push origin main
