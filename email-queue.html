<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Outreach Queue - Madurai Land Intelligence</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased">
  <div class="max-w-4xl mx-auto p-4 sm:p-6 space-y-6">
    
    <!-- Header -->
    <header class="bg-gradient-to-br from-slate-900 to-slate-800 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-4">
      <div class="flex items-center justify-between">
        <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-white">✉️ Email Outreach Queue</h1>
        <a href="index.html" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-xl transition">← Back to Main</a>
      </div>
      <p class="text-xs sm:text-sm text-slate-400">Corporate leads filtered for direct email campaigns and status tracking.</p>
      
      <div class="grid grid-cols-3 gap-3 pt-2">
        <div class="bg-slate-950/60 border border-slate-800/80 rounded-xl p-3 text-center">
          <div id="statTotal" class="text-xl font-bold text-sky-400">0</div>
          <div class="text-[10px] uppercase tracking-wider text-slate-400">Email Leads</div>
        </div>
        <div class="bg-slate-950/60 border border-slate-800/80 rounded-xl p-3 text-center">
          <div id="statContacted" class="text-xl font-bold text-amber-400">0</div>
          <div class="text-[10px] uppercase tracking-wider text-slate-400">Contacted</div>
        </div>
        <div class="bg-slate-950/60 border border-slate-800/80 rounded-xl p-3 text-center">
          <div id="statPending" class="text-xl font-bold text-emerald-400">0</div>
          <div class="text-[10px] uppercase tracking-wider text-slate-400">Pending</div>
        </div>
      </div>
    </header>

    <!-- Search Box -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-lg">
      <input type="text" id="searchInput" placeholder="Search by name, category, or location..." 
        class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-sky-500 text-slate-200 placeholder-slate-500">
    </div>

    <!-- Leads List -->
    <div id="leadsContainer" class="space-y-4">
      <!-- Injected dynamically -->
    </div>

  </div>

  <script>
    let emailLeads = [];

    async function loadData() {
      try {
        const response = await fetch('landdatabase.json?' + new Date().getTime());
        const data = await response.json();
        const savedStatuses = JSON.parse(localStorage.getItem('lead_statuses') || '{}');
        
        emailLeads = (data.leads || [])
          .filter(lead => lead.email)
          .map(lead => ({
            ...lead,
            status: savedStatuses[lead.id || lead.name] || lead.status || 'New'
          }));
        
        updateStats();
        renderLeads(emailLeads);
      } catch (err) {
        console.error("Error loading leads:", err);
      }
    }

    function updateStats() {
      document.getElementById('statTotal').innerText = emailLeads.length;
      document.getElementById('statContacted').innerText = emailLeads.filter(l => l.status === 'Contacted').length;
      document.getElementById('statPending').innerText = emailLeads.filter(l => l.status === 'New').length;
    }

    function markContacted(identifier) {
      const lead = emailLeads.find(l => (l.id || l.name) === identifier);
      if (lead && lead.status === 'New') {
        lead.status = 'Contacted';
        const savedStatuses = JSON.parse(localStorage.getItem('lead_statuses') || '{}');
        savedStatuses[identifier] = 'Contacted';
        localStorage.setItem('lead_statuses', JSON.stringify(savedStatuses));
        updateStats();
        filterLeads();
      }
    }

    function renderLeads(leads) {
      const container = document.getElementById('leadsContainer');
      if (leads.length === 0) {
        container.innerHTML = `<div class="bg-slate-900 border border-slate-800 rounded-2xl p-8 text-center text-slate-500 text-sm">No email leads available.</div>`;
        return;
      }

      container.innerHTML = leads.map(lead => {
        const leadId = lead.id || lead.name;
        const emailTo = lead.email;
        const emailSubject = encodeURIComponent(`Prime 23.5-Cent Commercial Land on Alagar Kovil Highway, Madurai`);
        const emailBody = encodeURIComponent(`Dear ${lead.name},\n\nWe noted your active requirement for "${lead.category}" in Madurai. We are offering a prime 23.5-cent corner plot directly on Alagar Kovil Highway suited for your development.\n\nPlease let us know a convenient time to discuss.\n\nBest regards,\nLand Acquisition Team`);
        const emailLink = `mailto:${emailTo}?subject=${emailSubject}&body=${emailBody}`;

        return `
          <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl space-y-4">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
              <div>
                <h3 class="text-base sm:text-lg font-bold text-white">${lead.name}</h3>
                <div class="flex items-center gap-2 mt-1">
                  <span class="bg-cyan-950/80 text-cyan-400 border border-cyan-800/60 text-[11px] px-2.5 py-0.5 rounded-full font-medium">${lead.category}</span>
                  <span class="border text-[10px] px-2 py-0.5 rounded-full font-semibold ${lead.status === 'Contacted' ? 'bg-amber-950 text-amber-400 border-amber-800' : 'bg-slate-950 text-slate-400 border-slate-800'}">${lead.status}</span>
                </div>
              </div>
              <span class="text-xs text-slate-400 bg-slate-950 px-3 py-1 rounded-lg border border-slate-800 self-start sm:self-auto">📍 ${lead.location}</span>
            </div>
            <p class="text-xs sm:text-sm text-slate-300 bg-slate-950/40 p-3 rounded-xl border border-slate-800/60">${lead.notes || 'High-intent buyer.'}</p>
            <div class="flex items-center justify-between pt-2 border-t border-slate-800 text-xs">
              <span class="text-slate-400">✉️ Email: <strong class="text-slate-200">${lead.email}</strong></span>
              <a href="${emailLink}" onclick="markContacted('${leadId}')"
                 class="bg-sky-600 hover:bg-sky-500 text-white font-medium px-5 py-2 rounded-xl transition shadow-lg shadow-sky-950">
                 Send Email ✉️
              </a>
            </div>
          </div>
        `;
      }).join('');
    }

    function filterLeads() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = emailLeads.filter(l => 
        l.name.toLowerCase().includes(query) || 
        l.category.toLowerCase().includes(query) || 
        l.location.toLowerCase().includes(query)
      );
      renderLeads(filtered);
    }

    document.getElementById('searchInput').addEventListener('input', filterLeads);
    loadData();
  </script>
</body>
</html>
