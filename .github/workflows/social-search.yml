name: Social Search and Directory Pipeline

on:
  schedule:
    - cron: '0 */8 * * *' # Automatically runs every 8 hours
  workflow_dispatch: # Allows manual triggers from the Actions tab if needed

permissions:
  contents: write # Grants the GITHUB_TOKEN permission to push updated JSON files back to the repo

jobs:
  run-social-search:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run social and directory script
        run: node scripts/social-directory-search.mjs

      - name: Commit and push updated social data
        run: |
              git config --global user.name "github-actions[bot]"
              git config --global user.email "github-actions[bot]@users.noreply.github.com"
              git add data/social-leads.json
              git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update social & directory leads [skip ci]"
              git push
