<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Madurai Land Acquisition Intelligence</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased">
  <div class="max-w-4xl mx-auto p-4 sm:p-6 space-y-6">
    
    <!-- Header Banner -->
    <header class="bg-gradient-to-br from-slate-900 to-slate-800 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-4">
      <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-white">Madurai Land Acquisition Intelligence</h1>
      <p class="text-sm text-slate-400">Targeted Pipeline: Hotels, Hospitals, Educational Trusts, & NRI/Local Investors for Prime 23.5-Cent Corner Plot, Alagar Kovil Highway.</p>

      <!-- Quick Access Queue Buttons -->
      <div class="grid grid-cols-2 gap-3 mb-6">
        <a href="whatsapp-queue.html" 
           class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs sm:text-sm font-semibold py-3 px-4 rounded-xl text-center transition shadow-lg shadow-emerald-950 flex items-center justify-center gap-2">
           📱 WhatsApp Queue
        </a>
        <a href="email-queue.html" 
           class="bg-sky-600 hover:bg-sky-500 text-white text-xs sm:text-sm font-semibold py-3 px-4 rounded-xl text-center transition shadow-lg shadow-sky-950 flex items-center justify-center gap-2">
           ✉️ Email Queue
        </a>
      </div>
      
      <!-- Metrics Grid -->
      <div class="grid grid-cols-3 gap-3 pt-2">
        <div class="bg-slate-950/60 border border-slate-800/80 rounded-xl p-3 text-center">
          <div id="statTotal" class="text-xl sm:text-2xl font-bold text-cyan-400">0</div>
          <div class="text-[10px] sm:text-xs uppercase tracking-wider text-slate-400">Total Leads</div>
        </div>
        <div class="bg-slate-950/60 border border-slate-800/80 rounded-xl p-3 text-center">
          <div id="statContacted" class="text-xl sm:text-2xl font-bold text-amber-400">0</div>
          <div class="text-[10px] sm:text-xs uppercase tracking-wider text-slate-400">Contacted</div>
        </div>
        <div class="bg-slate-950/60 border border-slate-800/80 rounded-xl p-3 text-center">
          <div id="statInterested" class="text-xl sm:text-2xl font-bold text-emerald-400">0</div>
          <div class="text-[10px] sm:text-xs uppercase tracking-wider text-slate-400">Interested</div>
        </div>
      </div>
    </header>

    <!-- Search & Filter Bar -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-lg space-y-3">
      <input type="text" id="searchInput" placeholder="Search by organization name, requirement..." 
        class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-cyan-500 text-slate-200 placeholder-slate-500">
      <select id="categoryFilter" 
        class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-cyan-500 text-slate-200">
        <option value="">All Categories & Sectors</option>
      </select>
    </div>

    <!-- Leads Container / Cards List -->
    <div id="leadsContainer" class="space-y-4">
      <!-- Injected dynamically via JS -->
    </div>

  </div>

  <script>
    let allLeads = [];

    async function loadData() {
      try {
        const response = await fetch('landdatabase.json?' + new Date().getTime());
        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
        
        const data = await response.json();
        allLeads = data.leads || (Array.isArray(data) ? data : []);
        
        console.log("Successfully loaded leads schema:", allLeads);

        // Defensive status counting (case-insensitive check)
        const contactedCount = allLeads.filter(l => l.status && l.status.toLowerCase() === 'contacted').length;
        const interestedCount = allLeads.filter(l => l.status && l.status.toLowerCase() === 'interested').length;

        // Update stats UI
        document.getElementById('statTotal').innerText = allLeads.length;
        document.getElementById('statContacted').innerText = contactedCount;
        document.getElementById('statInterested').innerText = interestedCount;

        // Populate category dropdown safely
        const categories = [...new Set(allLeads.map(l => l.category).filter(Boolean))];
        const categoryFilter = document.getElementById('categoryFilter');
        categoryFilter.innerHTML = '<option value="">All Categories & Sectors</option>' + 
          categories.map(c => `<option value="${c}">${c}</option>`).join('');

        renderLeads(allLeads);
      } catch (err) {
        console.error("Critical error loading database:", err);
        document.getElementById('leadsContainer').innerHTML = `
          <div class="bg-slate-900 border border-red-900/50 rounded-2xl p-6 text-center text-red-400 text-sm space-y-2">
            <p class="font-bold">Failed to load lead database.</p>
            <p class="text-xs text-slate-400">${err.message}</p>
          </div>`;
      }
    }

    function renderLeads(leads) {
      const container = document.getElementById('leadsContainer');
      if (!leads || leads.length === 0) {
        container.innerHTML = `
          <div class="bg-slate-900 border border-slate-800 rounded-2xl p-8 text-center text-slate-500 text-sm">
            No matching leads found.
          </div>`;
        return;
      }

      container.innerHTML = leads.map(lead => {
        const name = lead.name || 'Unnamed Prospect';
        const category = lead.category || 'General Investment';
        const location = lead.location || 'Madurai';
        const notes = lead.notes || lead.requirement || 'High-intent commercial land seeker in Madurai.';
        const phone = lead.phone || 'N/A';
        const emailTo = lead.email || 'inquiry@madurailand.com';

        const waNumber = lead.whatsapp || lead.phone || '';
        const waMessage = encodeURIComponent(`Hello ${name}, regarding your requirement for ${category} in Madurai, we have a prime 23.5-cent corner plot directly on Alagar Kovil Highway available. Would you like to review details?`);
        const waLink = waNumber ? `https://wa.me/${waNumber.replace(/[^0-9]/g, '')}?text=${waMessage}` : '#';

        const emailSubject = encodeURIComponent(`Prime 23.5-Cent Commercial Land on Alagar Kovil Highway, Madurai`);
        const emailBody = encodeURIComponent(`Dear ${name},\n\nWe noted your active requirement for "${category}" in Madurai. We are offering a prime 23.5-cent corner plot directly on Alagar Kovil Highway suited for your development.\n\nPlease let us know a convenient time to discuss.\n\nBest regards,\nLand Acquisition Team`);
        const emailLink = `mailto:${emailTo}?subject=${emailSubject}&body=${emailBody}`;

        return `
          <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl space-y-4 transition hover:border-slate-700">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
              <div>
                <h3 class="text-base sm:text-lg font-bold text-white">${name}</h3>
                <span class="inline-block bg-cyan-950/80 text-cyan-400 border border-cyan-800/60 text-[11px] px-2.5 py-0.5 rounded-full font-medium mt-1">
                  ${category}
                </span>
              </div>
              <span class="text-xs text-slate-400 bg-slate-950 px-3 py-1 rounded-lg border border-slate-800 self-start sm:self-auto">
                📍 ${location}
              </span>
            </div>

            <p class="text-xs sm:text-sm text-slate-300 bg-slate-950/40 p-3 rounded-xl border border-slate-800/60">
              ${notes}
            </p>

            <div class="flex flex-wrap items-center justify-between gap-3 pt-2 border-t border-slate-800/80 text-xs">
              <div class="text-slate-400 space-y-0.5">
                <div>📞 Phone: <a href="tel:${phone}" class="text-slate-200 hover:underline">${phone}</a></div>
                <div>✉️ Email: <a href="${emailLink}" class="text-slate-200 hover:underline">${emailTo}</a></div>
              </div>

              <!-- Action Buttons -->
              <div class="flex items-center gap-2 w-full sm:w-auto pt-2 sm:pt-0">
                <a href="${waLink}" target="_blank" 
                   class="flex-1 sm:flex-none text-center bg-emerald-600 hover:bg-emerald-500 text-white font-medium px-4 py-2 rounded-xl transition shadow-lg shadow-emerald-950 flex items-center justify-center gap-1.5">
                   💬 WhatsApp
                </a>
                <a href="${emailLink}" 
                   class="flex-1 sm:flex-none text-center bg-cyan-600 hover:bg-cyan-500 text-white font-medium px-4 py-2 rounded-xl transition shadow-lg shadow-cyan-950 flex items-center justify-center gap-1.5">
                   ✉️ Send Email
                </a>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // Filter Logic
    function filterLeads() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const selectedCategory = document.getElementById('categoryFilter').value;

      const filtered = allLeads.filter(lead => {
        const nameMatch = (lead.name || '').toLowerCase().includes(query);
        const categoryMatch = (lead.category || '').toLowerCase().includes(query);
        const locationMatch = (lead.location || '').toLowerCase().includes(query);
        
        const matchesQuery = nameMatch || categoryMatch || locationMatch;
        const matchesCategory = !selectedCategory || lead.category === selectedCategory;
        return matchesQuery && matchesCategory;
      });

      renderLeads(filtered);
    }

    document.getElementById('searchInput').addEventListener('input', filterLeads);
    document.getElementById('categoryFilter').addEventListener('change', filterLeads);

    loadData();
  </script>
</body>
</html>
