<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Madurai High-Intent Land Buyers</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8fafc; color: #1e293b; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        header { background: #0f172a; color: #fff; padding: 25px; border-radius: 10px; margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
        h1 { margin: 0; font-size: 24px; }
        .stats { display: flex; gap: 20px; background: rgba(255,255,255,0.1); padding: 10px 20px; border-radius: 6px; }
        .stat-item { text-align: center; }
        .stat-val { font-size: 20px; font-weight: bold; color: #38bdf8; }
        .stat-label { font-size: 12px; color: #94a3b8; }
        .controls { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        input, select { padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; flex: 1; min-width: 200px; }
        .table-card { background: #fff; border-radius: 10px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 15px; border-bottom: 1px solid #e2e8f0; font-size: 14px; }
        th { background: #f1f5f9; color: #475569; font-weight: 600; }
        tr:hover { background: #f8fafc; }
        .btn-wa { background: #16a34a; color: white; padding: 6px 12px; border-radius: 4px; text-decoration: none; font-weight: 500; display: inline-block; font-size: 13px; }
        .btn-wa:hover { background: #15803d; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 500; }
        .badge-new { background: #e0f2fe; color: #0369a1; }
        .badge-contacted { background: #fef3c7; color: #b45309; }
        .badge-interested { background: #dcfce7; color: #15803d; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>Madurai Land Acquisition Intelligence</h1>
                <p style="margin: 5px 0 0 0; color: #94a3b8; font-size: 14px;">Hotels, Hospitals, Institutes, & NRI/Local Investor Pipelines</p>
            </div>
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-val" id="totalLeadsCount">0</div>
                    <div class="stat-label">Total Leads</div>
                </div>
                <div class="stat-item">
                    <div class="stat-val" id="contactedCount">0</div>
                    <div class="stat-label">Contacted</div>
                </div>
            </div>
        </header>

        <div class="controls">
            <input type="text" id="searchInput" placeholder="Search by name, category, or notes..." onkeyup="filterLeads()">
            <select id="categoryFilter" onchange="filterLeads()">
                <option value="">All Categories</option>
                <option value="Hotels">Hotels & Hospitality</option>
                <option value="Hospitals">Hospitals & Healthcare</option>
                <option value="Educational">Educational Trusts</option>
                <option value="NRI">NRI Investors</option>
                <option value="HNIs">Local HNIs / Family Office</option>
            </select>
        </div>

        <div class="table-card">
            <table>
                <thead>
                    <tr>
                        <th>Organization Name</th>
                        <th>Category</th>
                        <th>Location</th>
                        <th>Notes & Requirement</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="leadsTableBody">
                    <tr><td colspan="6" style="text-align: center; color: #64748b;">Loading land database...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let allLeads = [];
        let contactedSet = JSON.parse(localStorage.getItem('land_contacted_set') || '[]');

        async function loadData() {
            try {
                const response = await fetch('landdatabase.json?' + new Date().getTime());
                const data = await response.json();
                allLeads = data.leads || [];
                renderLeads(allLeads);
                updateStats();
            } catch (error) {
                document.getElementById('leadsTableBody').innerHTML = `<tr><td colspan="6" style="text-align: center; color: #ef4444;">Run workflow first to generate database records.</td></tr>`;
            }
        }

        function renderLeads(leads) {
            const tbody = document.getElementById('leadsTableBody');
            if (leads.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: #64748b;">No land buyers found. Trigger the GitHub Action workflow to fetch fresh leads.</td></tr>`;
                return;
            }

            tbody.innerHTML = leads.map(lead => {
                const isContacted = contactedSet.includes(lead.id);
                const statusClass = isContacted ? 'badge-contacted' : 'badge-new';
                const statusText = isContacted ? 'Contacted' : 'New';

                return `
                    <tr>
                        <td><strong>${lead.name}</strong><br><small style="color: #64748b;">${lead.phone || ''}</small></td>
                        <td>${lead.category}</td>
                        <td>${lead.location}</td>
                        <td>${lead.notes}</td>
                        <td><span class="badge ${statusClass}" onclick="toggleStatus('${lead.id}')" style="cursor: pointer;" title="Click to toggle status">${statusText}</span></td>
                        <td><a href="${lead.whatsapp}" target="_blank" class="btn-wa" onclick="markContacted('${lead.id}')">WhatsApp</a></td>
                    </tr>
                `;
            }).join('');
        }

        function filterLeads() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const category = document.getElementById('categoryFilter').value.toLowerCase();

            const filtered = allLeads.filter(lead => {
                const matchesQuery = lead.name.toLowerCase().includes(query) || lead.notes.toLowerCase().includes(query) || lead.location.toLowerCase().includes(query);
                const matchesCategory = category === "" || lead.category.toLowerCase().includes(category);
                return matchesQuery && matchesCategory;
            });

            renderLeads(filtered);
        }

        function markContacted(id) {
            if (!contactedSet.includes(id)) {
                contactedSet.push(id);
                localStorage.setItem('land_contacted_set', JSON.stringify(contactedSet));
                updateStats();
                renderLeads(allLeads);
            }
        }

        function toggleStatus(id) {
            if (contactedSet.includes(id)) {
                contactedSet = contactedSet.filter(item => item !== id);
            } else {
                contactedSet.push(id);
            }
            localStorage.setItem('land_contacted_set', JSON.stringify(contactedSet));
            updateStats();
            renderLeads(allLeads);
        }

        function updateStats() {
            document.getElementById('totalLeadsCount').innerText = allLeads.length;
            document.getElementById('contactedCount').innerText = contactedSet.length;
        }

        loadData();
    </script>
</body>
</html>
