<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Madurai Land Acquisition Intelligence</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-sub: #64748b;
            --border-color: #e2e8f0;
            --primary: #0f172a;
            --accent: #2563eb;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg-color); color: var(--text-main); margin: 0; padding: 20px; }
        .container { max-width: 1280px; margin: 0 auto; }
        header { background: var(--primary); color: #fff; padding: 25px 30px; border-radius: 12px; margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
        .subtitle { margin: 5px 0 0 0; color: #94a3b8; font-size: 14px; }
        .stats-container { display: flex; gap: 15px; flex-wrap: wrap; }
        .stat-card { background: rgba(255,255,255,0.08); padding: 12px 20px; border-radius: 8px; text-align: center; min-width: 100px; border: 1px solid rgba(255,255,255,0.1); }
        .stat-val { font-size: 22px; font-weight: bold; color: #38bdf8; }
        .stat-label { font-size: 11px; color: #cbd5e1; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .controls-card { background: var(--card-bg); padding: 20px; border-radius: 12px; margin-bottom: 25px; box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1); display: flex; gap: 15px; flex-wrap: wrap; align-items: center; }
        .search-box, .filter-select { padding: 12px 16px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 14px; outline: none; transition: border-color 0.2s; }
        .search-box { flex: 2; min-width: 250px; }
        .filter-select { flex: 1; min-width: 200px; background: #fff; }
        .search-box:focus, .filter-select:focus { border-color: var(--accent); }

        .table-container { background: var(--card-bg); border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05); overflow: hidden; border: 1px solid var(--border-color); }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 16px 20px; border-bottom: 1px solid var(--border-color); font-size: 14px; vertical-align: middle; }
        th { background: #f1f5f9; color: #475569; font-weight: 600; text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px; }
        tr:hover { background: #f8fafc; }
        tr:last-child td { border-bottom: none; }

        .badge { padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; display: inline-block; text-align: center; cursor: pointer; user-select: none; transition: transform 0.1s; }
        .badge:active { transform: scale(0.95); }
        .badge-new { background: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; }
        .badge-contacted { background: #fef3c7; color: #b45309; border: 1px solid #fde68a; }
        .badge-interested { background: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }

        .btn-wa { background: #16a34a; color: white; padding: 8px 16px; border-radius: 6px; text-decoration: none; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; transition: background 0.2s, box-shadow 0.2s; box-shadow: 0 2px 4px rgba(22, 163, 74, 0.2); }
        .btn-wa:hover { background: #15803d; box-shadow: 0 4px 6px rgba(22, 163, 74, 0.3); }
        
        .meta-info { font-size: 12px; color: var(--text-sub); margin-top: 4px; }
        .empty-state { text-align: center; padding: 50px 20px; color: var(--text-sub); font-size: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>Madurai Land Acquisition Intelligence</h1>
                <p class="subtitle">Targeted Pipeline: Hotels, Hospitals, Educational Trusts, & NRI/Local Investors</p>
            </div>
            <div class="stats-container">
                <div class="stat-card">
                    <div class="stat-val" id="totalCount">0</div>
                    <div class="stat-label">Total Leads</div>
                </div>
                <div class="stat-card">
                    <div class="stat-val" id="contactedCount">0</div>
                    <div class="stat-label">Contacted</div>
                </div>
                <div class="stat-card">
                    <div class="stat-val" id="interestedCount">0</div>
                    <div class="stat-label">Interested</div>
                </div>
            </div>
        </header>

        <div class="controls-card">
            <input type="text" id="searchInput" class="search-box" placeholder="Search by organization name, requirement notes, or location..." onkeyup="filterLeads()">
            <select id="categoryFilter" class="filter-select" onchange="filterLeads()">
                <option value="">All Categories & Sectors</option>
                <option value="Hotels">Hotels & Hospitality</option>
                <option value="Hospitals">Hospitals & Healthcare</option>
                <option value="Educational">Educational Trusts</option>
                <option value="NRI">NRI Investors</option>
                <option value="HNIs">Local HNIs / Family Office</option>
            </select>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th style="width: 25%;">Organization / Buyer</th>
                        <th style="width: 18%;">Category</th>
                        <th style="width: 12%;">Location</th>
                        <th style="width: 28%;">Requirement Notes</th>
                        <th style="width: 10%;">Status</th>
                        <th style="width: 7%;">Action</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="6" class="empty-state">Loading intelligence database...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let allLeads = [];
        let leadStatuses = JSON.parse(localStorage.getItem('land_lead_statuses') || '{}');

        async function loadDatabase() {
            try {
                const response = await fetch('landdatabase.json?' + new Date().getTime());
                const data = await response.json();
                allLeads = data.leads || [];
                renderTable(allLeads);
                updateStats();
            } catch (err) {
                document.getElementById('tableBody').innerHTML = `<tr><td colspan="6" class="empty-state" style="color: #ef4444;">Database not found or workflow not yet executed. Run the GitHub Action to populate records.</td></tr>`;
            }
        }

        function renderTable(leads) {
            const tbody = document.getElementById('tableBody');
            if (leads.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="empty-state">No matching buyer records found.</td></tr>`;
                return;
            }

            tbody.innerHTML = leads.map(lead => {
                const status = leadStatuses[lead.id] || 'New';
                let badgeClass = 'badge-new';
                if (status === 'Contacted') badgeClass = 'badge-contacted';
                if (status === 'Interested') badgeClass = 'badge-interested';

                const defaultMsg = encodeURIComponent(`Hello ${lead.name}, sharing details regarding our prime 23.5-cent corner commercial plot with highway frontage on Alagar Kovil Highway, Madurai. Ideal for your expansion requirement. Let's connect if interested.`);
                const waLink = lead.whatsapp ? `https://wa.me/${lead.whatsapp.replace(/[^0-9]/g, '')}?text=${defaultMsg}` : '#';

                return `
                    <tr>
                        <td>
                            <strong>${lead.name}</strong>
                            <div class="meta-info">${lead.phone || 'No phone listed'}</div>
                        </td>
                        <td>${lead.category}</td>
                        <td>${lead.location}</td>
                        <td>${lead.notes}</td>
                        <td><span class="badge ${badgeClass}" onclick="cycleStatus('${lead.id}')" title="Click to change status">${status}</span></td>
                        <td>
                            ${lead.whatsapp ? `<a href="${waLink}" target="_blank" class="btn-wa" onclick="setStatusContacted('${lead.id}')">WhatsApp</a>` : '<span style="color:#94a3b8; font-size:12px;">N/A</span>'}
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function filterLeads() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const cat = document.getElementById('categoryFilter').value.toLowerCase();

            const filtered = allLeads.filter(lead => {
                const matchesText = lead.name.toLowerCase().includes(query) || lead.notes.toLowerCase().includes(query) || lead.location.toLowerCase().includes(query);
                const matchesCat = cat === '' || lead.category.toLowerCase().includes(cat);
                return matchesText && matchesCat;
            });

            renderTable(filtered);
        }

        function cycleStatus(id) {
            const current = leadStatuses[id] || 'New';
            let next = 'Contacted';
            if (current === 'New') next = 'Contacted';
            else if (current === 'Contacted') next = 'Interested';
            else if (current === 'Interested') next = 'New';

            leadStatuses[id] = next;
            localStorage.setItem('land_lead_statuses', JSON.stringify(leadStatuses));
            renderTable(allLeads);
            updateStats();
        }

        function setStatusContacted(id) {
            if (!leadStatuses[id] || leadStatuses[id] === 'New') {
                leadStatuses[id] = 'Contacted';
                localStorage.setItem('land_lead_statuses', JSON.stringify(leadStatuses));
                updateStats();
                renderTable(allLeads);
            }
        }

        function updateStats() {
            document.getElementById('totalCount').innerText = allLeads.length;
            const contacted = Object.values(leadStatuses).filter(s => s === 'Contacted').length;
            const interested = Object.values(leadStatuses).filter(s => s === 'Interested').length;
            document.getElementById('contactedCount').innerText = contacted;
            document.getElementById('interestedCount').innerText = interested;
        }

        loadDatabase();
    </script>
</body>
</html>
